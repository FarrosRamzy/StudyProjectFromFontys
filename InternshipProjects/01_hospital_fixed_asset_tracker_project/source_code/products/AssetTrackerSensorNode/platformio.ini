; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
test_framework = unity
test_build_src = no
test_ignore =
    shared
    test_helpers
    test_mqtt_payload_builder
    test_timing_native
    test_state_decision_native
    test_remote_config_validator_native
    test_text_utils_native
    test_duplicate_tag_native
    test_mqtt_command_core_native
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson@^7.2.2

[env:native]
platform = native
test_framework = unity
test_build_src = no
test_ignore =
    shared
    test_helpers
    test_mqtt_payload_builder
    test_mqtt_topics_esp32
    test_mqtt_payloads_asset_esp32
    test_mqtt_payloads_status_esp32
    test_mqtt_guards_esp32
    test_text_utils_esp32
    test_duplicate_tag_esp32
    test_mqtt_command_core_esp32
lib_deps =
    bblanchon/ArduinoJson@^7.2.2
build_flags =
    -std=gnu++17
    -D UNIT_TEST